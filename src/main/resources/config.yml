  language: "en"
  
  # Timezone for scheduled announcements (ZoneId format)
  timezone: "Europe/Istanbul"
  
  # Auto broadcaster settings
  auto-broadcaster-enabled: true
  interval-seconds: 300
  broadcast-mode: "SEQUENCE" # 'SEQUENCE' or 'RANDOM'

